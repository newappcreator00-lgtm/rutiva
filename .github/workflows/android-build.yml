name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Web Dosyalarını Hazırla ve Capacitor Kur
        run: |
          mkdir -p www
          cp *.html *.css *.js www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Sağlık Takipçim" "com.saglik.takip" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: APK Derleme (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: SaglikTakipcim-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
