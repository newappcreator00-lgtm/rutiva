name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web Dosyalarını Hazırla ve Capacitor Kur
        run: |
          mkdir -p www
          cp *.html *.css *.js www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6 @codetrix-studio/capacitor-google-auth --legacy-peer-deps
          node -e 'const fs = require("fs"); fs.writeFileSync("capacitor.config.json", JSON.stringify({ appId: "com.saglik.takip", appName: "Sağlık Takipçim", webDir: "www", plugins: { StatusBar: { overlaysWebView: false, style: "DARK", backgroundColor: "#4f46e5" }, GoogleAuth: { scopes: ["profile", "email"], serverClientId: "270075251216-h45ek67k1cr9m0lctbplq4lssc6vb30u.apps.googleusercontent.com", clientId: "270075251216-h45ek67k1cr9m0lctbplq4lssc6vb30u.apps.googleusercontent.com", forceCodeForRefreshToken: true } } }, null, 2));'
          npx cap add android
          npx cap sync android

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Keystore ve SHA-1 Kontrolü
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore ./debug.keystore
          fi
          echo "=== FIREBASE ICIN SHA-1 PARMAK IZI ==="
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1

      - name: APK Derleme (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK ve Keystore Dosyalarını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: SaglikTakipcim-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            debug.keystore
