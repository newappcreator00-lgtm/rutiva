name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Web Dosyalarını Hazırla ve Capacitor Kur
        run: |
          export CLIENT_ID="1061356505510-bu8fks3id3vnitjebte8469ma1p2ha7l.apps.googleusercontent.com"
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("google-services.json")) {
              console.error("HATA: google-services.json ana dizinde yok!");
              process.exit(1);
            }
            const gs = JSON.parse(fs.readFileSync("google-services.json", "utf8"));
            const c = gs.client?.[0];
            const pkg = c?.client_info?.android_client_info?.package_name;
            const oauth = c?.oauth_client || [];
            console.log("Paket:", pkg, "| OAuth sayisi:", oauth.length);
            if (pkg !== "com.rutiva.app" || oauth.length < 2) {
              console.error("HATA: google-services.json icinde SHA-1 veya Web Client eksik! Firebase uzerinden guncel dosyayi indirip yukleyin.");
              process.exit(1);
            }
          '
          mkdir -p www
          cp *.html *.css *.js www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6 @codetrix-studio/capacitor-google-auth --legacy-peer-deps
          node -e 'const fs = require("fs"); const cid = process.env.CLIENT_ID; fs.writeFileSync("capacitor.config.json", JSON.stringify({ appId: "com.rutiva.app", appName: "Rutiva", webDir: "www", plugins: { StatusBar: { overlaysWebView: false, style: "DARK", backgroundColor: "#4f46e5" }, GoogleAuth: { scopes: ["profile", "email"], serverClientId: cid, forceCodeForRefreshToken: true } } }, null, 2));'
          npx cap add android
          cp google-services.json android/app/google-services.json
          npx cap sync android
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/res/values/strings.xml";
            let xml = fs.readFileSync(p, "utf8");
            const cid = process.env.CLIENT_ID;
            if (!xml.includes("server_client_id")) {
              xml = xml.replace("</resources>", `    <string name="server_client_id">${cid}</string>\n</resources>`);
              fs.writeFileSync(p, xml);
            }
            let bg = fs.readFileSync("android/app/build.gradle", "utf8");
            if (!bg.includes("signingConfigs")) {
              const signBlock = "    signingConfigs {\n        debug {\n            storeFile file(\"../../debug.keystore\")\n            storePassword \"android\"\n            keyAlias \"androiddebugkey\"\n            keyPassword \"android\"\n        }\n    }\n\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }";
              bg = bg.replace("    buildTypes {", signBlock);
              fs.writeFileSync("android/app/build.gradle", bg);
            }
          '

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Keystore ve SHA-1 Kontrolü
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "=== KEYSTORE SHA-1 ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1

      - name: APK Derleme (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "=== APK IMZA SHA-1 ==="
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep SHA1

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Rutiva-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
